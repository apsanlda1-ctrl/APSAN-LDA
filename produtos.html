<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtos e Serviços | APSAN, LDA</title>
<meta name="description" content="Consulte os produtos e serviços publicados pela APSAN, LDA.">
<link rel="icon" href="https://apsanlda.com/logo.jpeg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#10243e;font-family:'Segoe UI',Arial,sans-serif}
header{background:#082d59;color:#fff;padding:14px 18px;box-shadow:0 4px 16px #061b3530}
.head{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:800;font-size:18px}.brand span{display:grid;gap:3px}.brand small{font-size:10px;letter-spacing:.6px;font-weight:600;color:#c9dcf2}.head-actions{display:flex;gap:10px}.head-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff16;border:1px solid #ffffff40;color:#fff;text-decoration:none;font-size:18px}.head-icon:first-child{background:#079b43;border-color:#079b43}
.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}
.back{color:#fff;text-decoration:none;border:1px solid #ffffff70;border-radius:10px;padding:10px 14px;font-weight:700}
.hero{background:linear-gradient(125deg,#082d59,#075da5);color:#fff;padding:27px 18px}
.hero>div{max-width:1160px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:#f5c84c}
h1{font-size:clamp(30px,5vw,42px);margin:0 0 8px}.hero p{color:#dcecff;margin:0;line-height:1.6}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:4%;bottom:-45px;width:220px;height:150px;border:2px solid #ffffff20;border-radius:28px;transform:rotate(-13deg);pointer-events:none}.hero>div{position:relative;z-index:1}
main{max-width:1200px;margin:0 auto 50px;padding:0 16px;min-height:55vh}
#apsan-products-public{margin:0!important;padding:24px 0!important;border:0!important}
#apsan-products-public .aps-head{text-align:left!important}
#apsan-products-public .aps-head h2{font-size:26px!important;color:#082d59!important}
#apsan-products-public .aps-search{width:100%;max-width:600px;padding:14px 16px;border:1px solid #d7e1ed;border-radius:12px;font:inherit;margin:12px 0 20px;background:#fff}
#apsan-products-public .aps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
#apsan-products-public .aps-card{background:#fff;border:1px solid #dce5ef;border-radius:17px;overflow:hidden;box-shadow:0 8px 22px #092b5010}
footer{text-align:center;padding:24px 15px;color:#718096;border-top:1px solid #dce5ef;background:#fff}
@media(max-width:560px){main{margin:0 auto 30px;padding:0 12px}.head{align-items:center}.brand{font-size:15px}.brand img{width:42px;height:42px}.back{padding:9px 11px;font-size:13px}.hero{padding:32px 17px}}

/* Floating WhatsApp contact: logo only, without text */
.aps-floating-whatsapp{position:fixed;right:18px;bottom:24px;z-index:9999;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#18b957;color:#fff;text-decoration:none;font-size:32px;box-shadow:0 5px 18px #0003;border:3px solid #fff;transition:transform .18s ease,box-shadow .18s ease}
.aps-floating-whatsapp:active{transform:scale(.94)}
.aps-floating-whatsapp i{line-height:1}
@media(max-width:560px){.aps-floating-whatsapp{right:15px;bottom:18px;width:54px;height:54px;font-size:30px}}

</style>
</head>
<body>

<main><div id="apsan-products-public"><p style="padding:22px;background:#fff;border-radius:12px;color:#64748b">A carregar produtos publicados…</p></div></main>
<a class="aps-floating-whatsapp" href="https://wa.me/244944403093" target="_blank" rel="noopener noreferrer" aria-label="Contactar a APSAN pelo WhatsApp" title="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
<footer>© APSAN, LDA — Agência de Prestação de Serviços entre Angola e Namíbia.</footer>
<script type="module" src="apsan-products.js?v=22"></script>
</body></html>
