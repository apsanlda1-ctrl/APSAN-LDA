<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeos | APSAN, LDA</title><meta name="description" content="Assista aos vídeos oficiais da APSAN, LDA.">
<link rel="icon" href="https://apsanlda.com/logo.jpeg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#10243e;font-family:'Segoe UI',Arial,sans-serif}
header{background:#082d59;color:#fff;padding:14px 18px;box-shadow:0 4px 16px #061b3530}
.head{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:800;font-size:18px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}
.back{color:#fff;text-decoration:none;border:1px solid #ffffff70;border-radius:10px;padding:10px 14px;font-weight:700}
.hero{background:#fff;color:#0b2d55;padding:15px 18px;border-bottom:1px solid #e2eaf3;box-shadow:0 3px 12px #0b2d5508}
.hero>div{max-width:1160px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:900;color:#0b5da5}
.hero h1{font-size:clamp(17px,3vw,21px);line-height:1.25;margin:0}
.hero p{display:none}
main{max-width:1200px;margin:30px auto 55px;padding:0 16px;min-height:45vh}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:#fff;border:1px solid #dce5ef;border-radius:17px;overflow:hidden;box-shadow:0 8px 22px #092b5010}
.frame{aspect-ratio:16/9;background:#071b31}.frame iframe{width:100%;height:100%;border:0;display:block}
.copy{padding:16px}.copy h2{font-size:18px;margin:0;color:#092d5c}.copy p{color:#65758a;line-height:1.55;margin:8px 0 0}
.empty,.error{padding:28px;text-align:center;background:#fff;border:1px dashed #cbd8e7;border-radius:16px;color:#64748b;line-height:1.6}
footer{text-align:center;padding:24px 15px;color:#718096;border-top:1px solid #dce5ef;background:#fff}
@media(max-width:560px){.head{align-items:center}.brand{font-size:15px}.brand img{width:42px;height:42px}.back{padding:9px 11px;font-size:13px}.hero{padding:32px 17px}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="head"><a class="brand" href="index.html"><img src="https://apsanlda.com/logo.jpeg" alt="APSAN"><span>APSAN, LDA</span></a><a class="back" href="index.html"><i class="fas fa-arrow-left"></i> Página principal</a></div></header>
<section class="hero"><div><h1 class="eyebrow">CANAL DE NOTÍCIAS DA APSAN</h1></div></section>
<main><div id="videoGrid" class="grid"><div class="empty">A carregar vídeos publicados…</div></div></main>
<footer>© APSAN, LDA — Agência de Prestação de Serviços entre Angola e Namíbia.</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBe28uhKKzOycocioX0YyyUZ0jmODDAnCM",
  authDomain: "apsan-web-manegment.firebaseapp.com",
  databaseURL: "https://apsan-web-manegment-default-rtdb.firebaseio.com",
  projectId: "apsan-web-manegment",
  storageBucket: "apsan-web-manegment.firebasestorage.app",
  messagingSenderId: "1026894206568",
  appId: "1:1026894206568:web:a8896e7caf7f14d6118ddd",
  measurementId: "G-RCCH3ME0MR"
};

const host = document.getElementById("videoGrid");
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
}[ch]));

function youtubeId(value) {
  try {
    const url = new URL(value);
    const hostname = url.hostname.toLowerCase().replace(/^www[.]|^m[.]/, "");
    if (hostname === "youtu.be") return url.pathname.split("/").filter(Boolean)[0] || "";
    if (hostname === "youtube.com" || hostname === "youtube-nocookie.com") {
      const parts = url.pathname.split("/").filter(Boolean);
      return url.searchParams.get("v") || (["embed","shorts","live"].includes(parts[0]) ? (parts[1] || "") : "");
    }
  } catch (_) {}
  return "";
}

function renderVideos(value) {
  const rows = Object.values(value || {}).filter(video =>
    video && video.published === true && youtubeId(video.url)
  );
  rows.sort((a,b) => (Number(b.updatedAt || b.createdAt || 0)) - (Number(a.updatedAt || a.createdAt || 0)));

  if (!rows.length) {
    host.innerHTML = '<div class="empty">Ainda não existem vídeos publicados. Assim que a equipa publicar vídeos no Web Management, eles aparecerão automaticamente nesta página.</div>';
    return;
  }

  host.innerHTML = rows.map(video => {
    const id = youtubeId(video.url);
    return '<article class="card"><div class="frame"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/' +
      encodeURIComponent(id) + '" title="' + esc(video.title || "Vídeo APSAN") +
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="copy"><h2>' +
      esc(video.title || "Vídeo APSAN") + '</h2><p>' + esc(video.description || "") +
      '</p></div></article>';
  }).join("");
}

try {
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let received = false;
  const fallback = setTimeout(() => {
    if (!received) host.innerHTML = '<div class="error">O servidor demorou a responder. Verifique a ligação à internet e atualize a página. Se o problema continuar, confirme a permissão de leitura pública de <b>apsanVideos</b> no Firebase Realtime Database.</div>';
  }, 12000);

  onValue(ref(db, "apsanVideos"), snapshot => {
    received = true;
    clearTimeout(fallback);
    renderVideos(snapshot.val());
  }, error => {
    received = true;
    clearTimeout(fallback);
    console.error("APSAN videos Firebase:", error);
    host.innerHTML = '<div class="error">Não foi possível carregar os vídeos: ' + esc(error.message || "erro de ligação") +
      '. Confirme se a regra de leitura de <b>apsanVideos</b> está pública no Firebase.</div>';
  });
} catch (error) {
  console.error("APSAN videos page:", error);
  host.innerHTML = '<div class="error">Ocorreu um erro ao iniciar a página de vídeos. Atualize o navegador e tente novamente.</div>';
}
</script></body></html>
